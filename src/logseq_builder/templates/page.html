{% extends 'base.html' %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}

{% block content %}
<article class="page-article">
  <header class="page-header">
    <h1 class="page-title">{% if page.icon %}<span class="page-icon" aria-hidden="true">{{ page.icon }}</span> {% endif %}{{ page.title }}</h1>
  </header>
  <div class="page-body">
    {{ page.html_content | safe }}
  </div>
</article>
{% endblock %}
